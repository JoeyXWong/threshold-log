<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Threshold" />
<meta name="theme-color" content="#0F1319" />
<title>Threshold Log</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #0F1319; color: #E9E5DB;
    -webkit-text-size-adjust: 100%; overscroll-behavior-y: none; }
  body { padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
  button { background: none; border: none; cursor: pointer; font: inherit; color: inherit; }
  input, textarea { -webkit-appearance: none; appearance: none; font: inherit; }
  input:focus, textarea:focus, button:focus-visible { outline: 2px solid #F0A431; outline-offset: 2px; }
  ::placeholder { color: #5C6773; }

  /* layout utilities used by the app */
  .flex { display: flex; } .grid { display: grid; } .hidden { display: none; }
  .inline-block { display: inline-block; }
  .flex-1 { flex: 1 1 0%; }
  .grid-cols-3 { grid-template-columns: repeat(3, minmax(0,1fr)); }
  .grid-cols-4 { grid-template-columns: repeat(4, minmax(0,1fr)); }
  .gap-2 { gap: .5rem; } .gap-3 { gap: .75rem; }
  .items-center { align-items: center; } .items-start { align-items: flex-start; }
  .items-baseline { align-items: baseline; } .items-stretch { align-items: stretch; }
  .justify-between { justify-content: space-between; }
  .justify-center { justify-content: center; }
  .text-left { text-align: left; } .text-center { text-align: center; } .text-right { text-align: right; }
  .uppercase { text-transform: uppercase; }
  .rounded { border-radius: .375rem; }
  .outline-none { outline: none; }
  .w-full { width: 100%; } .w-24 { width: 6rem; }
  .min-h-screen { min-height: 100vh; }
  .fixed { position: fixed; } .bottom-0 { bottom: 0; } .left-0 { left: 0; } .right-0 { right: 0; }
  .space-y-2 > * + * { margin-top: .5rem; }

  .p-3 { padding: .75rem; }
  .px-2 { padding-left: .5rem; padding-right: .5rem; }
  .px-3 { padding-left: .75rem; padding-right: .75rem; }
  .px-4 { padding-left: 1rem; padding-right: 1rem; }
  .py-2 { padding-top: .5rem; padding-bottom: .5rem; }
  .py-3 { padding-top: .75rem; padding-bottom: .75rem; }
  .py-4 { padding-top: 1rem; padding-bottom: 1rem; }
  .pt-3 { padding-top: .75rem; } .pt-4 { padding-top: 1rem; } .pt-5 { padding-top: 1.25rem; }
  .pb-2 { padding-bottom: .5rem; } .pb-3 { padding-bottom: .75rem; }
  .pb-4 { padding-bottom: 1rem; } .pb-24 { padding-bottom: 6rem; }
  .mt-1 { margin-top: .25rem; } .mt-2 { margin-top: .5rem; } .mt-3 { margin-top: .75rem; }
  .mt-4 { margin-top: 1rem; } .mt-6 { margin-top: 1.5rem; } .mt-8 { margin-top: 2rem; }
  .mb-2 { margin-bottom: .5rem; } .mb-3 { margin-bottom: .75rem; } .mb-4 { margin-bottom: 1rem; }

  /* the tab bar sits above the home indicator */
  .fixed.bottom-0 { padding-bottom: env(safe-area-inset-bottom); }
</style>
</head>
<body>
<div id="root"></div>
<script>__BUNDLE__</script>
</body>
</html>
